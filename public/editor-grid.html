<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocView — 동시편집</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='19' height='26' rx='3' fill='%231f4d47'/%3E%3Cpath d='M18 3v6a2 2 0 0 0 2 2h6z' fill='%234fd6c4'/%3E%3Crect x='9' y='16' width='11' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3Crect x='9' y='21' width='8' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="editor-body grid-editor-page">
  <script>
    // 다른 화면에 iframe으로 임베드할 때 툴바 없이 콘텐츠(그리드)만 보이게 하는 옵션.
    // 모듈 스크립트(grid-editor.bundle.js)가 뜨기 전에 툴바가 잠깐 보였다 사라지는 걸
    // 막기 위해 body 여는 태그 바로 뒤, 툴바가 파싱되기 전에 동기적으로 클래스를 붙인다.
    if (new URLSearchParams(location.search).get('chrome') === 'hidden') {
      document.body.classList.add('chrome-hidden');
    }
  </script>
  <header class="editor-toolbar" id="toolbar">
    <div class="toolbar-top-row">
      <div class="toolbar-group toolbar-left">
        <a href="/" class="icon-btn" title="문서 목록으로" aria-label="문서 목록으로 돌아가기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </a>
        <span id="doc-title" class="doc-title">문서 불러오는 중…</span>
        <span id="conn-status" class="conn-status" data-status="connecting">연결 중…</span>
        <span id="save-status" class="save-status" data-status="idle" hidden>
          <svg class="save-status-icon-saving" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/></svg>
          <svg class="save-status-icon-saved" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <svg class="save-status-icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
          <span class="save-status-text"></span>
        </span>
      </div>
      <div class="toolbar-group toolbar-right">
        <button id="search-btn" class="icon-btn" title="시트 내 검색 (Ctrl+F)" aria-label="시트 내 검색">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <div id="presence-list" class="presence-list" aria-label="현재 접속 중인 참여자"></div>
      </div>
    </div>
    <div class="toolbar-group toolbar-format">
      <div class="ribbon-group">
        <div class="ribbon-group-buttons ribbon-group-buttons-wrap">
          <div class="ribbon-row">
            <select id="cell-font-family" class="toolbar-select" title="글꼴">
              <option value="">기본 글꼴</option>
              <option value="맑은 고딕">맑은 고딕</option>
              <option value="Calibri">Calibri</option>
              <option value="Arial">Arial</option>
              <option value="바탕">바탕</option>
              <option value="굴림">굴림</option>
              <option value="Georgia">Georgia</option>
              <option value="Times New Roman">Times New Roman</option>
              <option value="Courier New">Courier New</option>
            </select>
            <input id="cell-font-size" class="toolbar-number" type="number" min="6" max="96" step="1" value="11" title="글자 크기" aria-label="글자 크기" />
            <button id="btn-font-size-up" class="icon-btn icon-btn-fontsize" title="글자 크기 크게">
              <span class="fontsize-glyph">가</span><span class="fontsize-arrow">▲</span>
            </button>
            <button id="btn-font-size-down" class="icon-btn icon-btn-fontsize" title="글자 크기 작게">
              <span class="fontsize-glyph">가</span><span class="fontsize-arrow">▼</span>
            </button>
          </div>
          <div class="ribbon-row">
            <button id="btn-cell-bold" class="icon-btn icon-btn-glyph" title="굵게 (Ctrl+B)"><strong>가</strong></button>
            <button id="btn-cell-italic" class="icon-btn icon-btn-glyph" title="기울임 (Ctrl+I)"><em>가</em></button>
            <button id="btn-cell-underline" class="icon-btn icon-btn-glyph" title="밑줄 (Ctrl+U)"><u>가</u></button>
            <span class="dropdown-btn" id="border-dropdown">
              <button id="btn-border" class="icon-btn" title="테두리">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17"/><path d="M3.5 12h17M12 3.5v17"/></svg>
              </button>
              <button class="dropdown-caret" aria-label="테두리 옵션 더 보기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="dropdown-menu" id="border-menu" hidden>
                <button data-border="all">모든 테두리</button>
                <button data-border="outside">바깥쪽 테두리</button>
                <button data-border="outside-thick">굵은 바깥쪽 테두리</button>
                <button data-border="top">위쪽 테두리</button>
                <button data-border="bottom">아래쪽 테두리</button>
                <button data-border="left">왼쪽 테두리</button>
                <button data-border="right">오른쪽 테두리</button>
                <button data-border="none">테두리 없음</button>
              </div>
            </span>
            <span class="dropdown-btn color-dropdown-btn" id="cell-bg-color-btn">
              <button id="btn-bg-color-apply" class="icon-btn color-apply-btn" title="배경 색 채우기">
                <span class="color-btn-glyph">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.6 10.2a2 2 0 0 1-2 1.8H8.6a2 2 0 0 1-2-1.8L5 8Z"/><path d="M8 8a4 4 0 0 1 8 0"/></svg>
                </span>
                <span class="color-btn-bar"></span>
              </button>
              <span class="dropdown-caret color-caret-wrap" aria-label="배경 색 선택">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                <input id="cell-bg-color" class="color-caret-input" type="color" value="#ffff00" title="배경 색 선택" aria-label="셀 배경 색 선택" />
              </span>
            </span>
            <span class="dropdown-btn color-dropdown-btn" id="cell-font-color-btn">
              <button id="btn-font-color-apply" class="icon-btn color-apply-btn" title="글자 색 채우기">
                <span class="color-btn-glyph">가</span>
                <span class="color-btn-bar"></span>
              </button>
              <span class="dropdown-caret color-caret-wrap" aria-label="글자 색 선택">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                <input id="cell-font-color" class="color-caret-input" type="color" value="#c0392b" title="글자 색 선택" aria-label="셀 글자 색 선택" />
              </span>
            </span>
            <button id="btn-cell-strike" class="icon-btn icon-btn-glyph icon-btn-glyph-wide" title="취소선"><s>가</s></button>
            <button id="btn-cell-clear-format" class="icon-btn" title="서식 지우기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-.94-.94-.94-2.46 0-3.4l9.6-9.6c.94-.94 2.46-.94 3.4 0l5.6 5.6c.94.94.94 2.46 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            </button>
          </div>
        </div>
        <span class="ribbon-group-label">글꼴</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons ribbon-group-buttons-wrap">
          <div class="ribbon-row">
            <button id="btn-valign-top" class="icon-btn" title="위쪽 맞춤">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" stroke-opacity=".55"/><path d="M6.5 7h11M6.5 10h7" stroke-width="2"/></svg>
            </button>
            <button id="btn-valign-middle" class="icon-btn" title="가운데 맞춤">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" stroke-opacity=".55"/><path d="M6.5 10.5h11M6.5 13.5h7" stroke-width="2"/></svg>
            </button>
            <button id="btn-valign-bottom" class="icon-btn" title="아래쪽 맞춤">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" stroke-opacity=".55"/><path d="M6.5 14h11M6.5 17h7" stroke-width="2"/></svg>
            </button>
            <button id="btn-wrap-text" class="icon-btn ribbon-btn-labeled" title="자동 줄 바꿈">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h13a3 3 0 0 1 0 6h-3"/><path d="m15.5 15.5 2.5 2.5-2.5 2.5"/><path d="M3 18h6"/></svg>
              <span class="ribbon-btn-label">자동 줄 바꿈</span>
            </button>
          </div>
          <div class="ribbon-row">
            <button id="btn-cell-align-l" class="icon-btn" title="왼쪽 정렬">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h14"/></svg>
            </button>
            <button id="btn-cell-align-c" class="icon-btn" title="가운데 정렬">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M8 12h8M6 18h12"/></svg>
            </button>
            <button id="btn-cell-align-r" class="icon-btn" title="오른쪽 정렬">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M10 12h10M6 18h14"/></svg>
            </button>
          </div>
        </div>
        <span class="ribbon-group-label">맞춤</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons ribbon-group-buttons-wrap">
          <div class="ribbon-row">
            <select id="cell-numfmt-select" class="toolbar-select toolbar-select-wide toolbar-select-full" title="표시 형식">
              <option value="general">일반</option>
              <option value="number">숫자</option>
              <option value="currency">통화</option>
              <option value="percent">백분율</option>
            </select>
          </div>
          <div class="ribbon-row">
            <button id="btn-numfmt-currency" class="icon-btn" title="회계 표시 형식">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H12"/><path d="M7 12h9"/><path d="M9.5 12a3.5 3.5 0 1 0 0 7H17"/></svg>
            </button>
            <button id="btn-numfmt-percent" class="icon-btn" title="백분율 스타일 (Ctrl+Shift+%)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
            </button>
            <button id="btn-numfmt-comma" class="icon-btn" title="쉼표 스타일">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 14h10"/><path d="M9 18c0 1.4-.6 2.2-1.6 2.6"/></svg>
            </button>
            <button id="btn-numfmt-decimal-down" class="icon-btn" title="자릿수 줄임">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><text x="2" y="16" font-size="11" stroke="none" fill="currentColor">.0</text><path d="M15 5v6M12.5 8.5 15 11l2.5-2.5"/></svg>
            </button>
            <button id="btn-numfmt-decimal-up" class="icon-btn" title="자릿수 늘림">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><text x="1" y="16" font-size="10" stroke="none" fill="currentColor">.00</text><path d="M18 11V5M15.5 7.5 18 5l2.5 2.5"/></svg>
            </button>
          </div>
        </div>
        <span class="ribbon-group-label">표시 형식</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons">
          <button id="btn-add-row" class="icon-btn icon-btn-insert" title="행 추가">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4.5"/><rect x="3" y="10.5" width="18" height="4.5" stroke-dasharray="2.2 2.2"/><path d="M12 19v4M9.5 21h5" stroke-width="2.2"/></svg>
          </button>
          <button id="btn-del-row" class="icon-btn icon-btn-delete" title="마지막 행 삭제">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4.5"/><rect x="3" y="10.5" width="18" height="4.5" stroke-dasharray="2.2 2.2"/><path d="M9.5 21h5" stroke-width="2.2"/></svg>
          </button>
          <button id="btn-add-col" class="icon-btn icon-btn-insert" title="열 추가">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="4.5" height="18"/><rect x="10.5" y="3" width="4.5" height="18" stroke-dasharray="2.2 2.2"/><path d="M19 9.5v5M21.5 12h-5" stroke-width="2.2"/></svg>
          </button>
          <button id="btn-del-col" class="icon-btn icon-btn-delete" title="마지막 열 삭제">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="4.5" height="18"/><rect x="10.5" y="3" width="4.5" height="18" stroke-dasharray="2.2 2.2"/><path d="M21.5 12h-5" stroke-width="2.2"/></svg>
          </button>
        </div>
        <span class="ribbon-group-label">셀</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons">
          <button id="btn-autosum" class="icon-btn icon-btn-glyph" title="자동 합계 — 위쪽(없으면 왼쪽)으로 연속된 숫자 칸을 더한다"><strong>Σ</strong></button>
          <button id="btn-freeze-panes" class="icon-btn" title="틀 고정 — 선택한 칸의 위쪽 행과 왼쪽 열을 고정한다" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" stroke-width="1.4"/><path d="M3.5 9h17M9 3.5v17" stroke-width="2.6"/></svg>
          </button>
          <button id="btn-find-replace" class="icon-btn" title="찾기 및 바꾸기 (Ctrl+H)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
        </div>
        <span class="ribbon-group-label">편집</span>
      </div>
    </div>
  </header>

  <div id="search-bar" class="search-bar" hidden role="dialog" aria-label="찾기 및 바꾸기">
    <div class="search-titlebar">찾기 및 바꾸기</div>
    <div class="search-row">
      <span class="search-label">찾을 내용:</span>
      <input id="search-input" type="text" placeholder="찾을 내용…" autocomplete="off" />
      <span id="search-scope-hint" class="search-scope-hint" hidden>선택 영역 안에서 찾음</span>
    </div>
    <div id="search-replace-row" class="search-row" hidden>
      <span class="search-label">바꿀 내용:</span>
      <input id="search-replace-input" type="text" placeholder="바꿀 내용…" autocomplete="off" />
    </div>
    <div class="search-row search-actions">
      <span id="search-count" class="search-count"></span>
      <span class="search-actions-spacer"></span>
      <button id="search-find-all" class="btn-mini">모두 찾기</button>
      <button id="search-next" class="btn-mini" disabled>다음 찾기</button>
      <button id="search-replace-one" class="btn-mini">바꾸기</button>
      <button id="search-replace-all" class="btn-mini">모두 바꾸기</button>
      <button id="search-close" class="btn-mini">닫기</button>
    </div>
  </div>

  <div id="unsupported-warning" class="unsupported-warning" hidden>
    이 시트는 규모가 커서 실시간 편집이 느릴 수 있습니다 — 대량 열람은 뷰어를 이용하세요.
    수식은 값으로만 입력·저장되며(예: =A1+B1), 편집기 화면에는 계산 결과 없이 수식 자체가 표시됩니다.
  </div>

  <div class="formula-bar">
    <span id="cell-ref-box" class="cell-ref-box">A1</span>
    <span class="fx-icon" aria-hidden="true">fx</span>
    <input id="formula-input" class="formula-input" type="text" placeholder="" autocomplete="off" aria-label="셀 내용 편집" />
  </div>

  <div id="grid-zoom-host">
    <main id="grid-editor" class="grid-editor-surface g-render-pending">
      <div class="grid-editor-scroll">
        <table id="grid-edit-table" class="grid-edit-table"></table>
      </div>
      <div class="grid-watermark-overlay" aria-hidden="true"></div>
    </main>
  </div>
  <div class="grid-status-bar">
    <div class="grid-tabs-row">
      <div id="sheet-tabs" class="grid-sheet-tabs" role="tablist"></div>
      <div class="grid-hscroll" role="scrollbar" aria-orientation="horizontal" aria-controls="grid-editor">
        <button id="hscroll-left" class="grid-hscroll-arrow" title="왼쪽으로 스크롤" aria-label="왼쪽으로 스크롤">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="grid-hscroll-track" id="hscroll-track">
          <div class="grid-hscroll-thumb" id="hscroll-thumb"></div>
        </div>
        <button id="hscroll-right" class="grid-hscroll-arrow" title="오른쪽으로 스크롤" aria-label="오른쪽으로 스크롤">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
    <div class="grid-status-row">
      <span id="grid-status-text" class="grid-status-text">준비</span>
      <div class="zoom-group" role="group" aria-label="확대/축소">
        <button id="zoom-out" class="zoom-btn" title="축소" aria-label="축소">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <div class="zoom-slider-track" id="zoom-slider-track">
          <div class="zoom-slider-fill" id="zoom-slider-fill"></div>
          <div class="zoom-slider-handle" id="zoom-slider-handle"></div>
        </div>
        <button id="zoom-in" class="zoom-btn" title="확대" aria-label="확대">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
        <span class="zoom-sep"></span>
        <span id="zoom-level" class="zoom-level">100%</span>
      </div>
    </div>
  </div>

  <div id="error-screen" class="error-screen" hidden>
    <div class="error-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <p id="error-message"></p>
      <a href="/" class="btn-pill btn-pill-primary">문서 목록으로</a>
    </div>
  </div>

  <script type="module" src="/js/grid-editor.bundle.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocView — 뷰어</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='19' height='26' rx='3' fill='%231f4d47'/%3E%3Cpath d='M18 3v6a2 2 0 0 0 2 2h6z' fill='%234fd6c4'/%3E%3Crect x='9' y='16' width='11' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3Crect x='9' y='21' width='8' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="viewer-body">
  <header class="viewer-toolbar" id="toolbar">
    <div class="toolbar-group toolbar-left">
      <a href="/" id="back-btn" class="icon-btn" title="문서 목록으로" aria-label="문서 목록으로 돌아가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <span id="doc-title" class="doc-title">문서 불러오는 중…</span>
    </div>

    <div class="toolbar-group toolbar-right">
      <span id="page-indicator" class="page-indicator" aria-live="polite"></span>
      <div class="zoom-group" role="group" aria-label="확대/축소">
        <button id="zoom-out" class="icon-btn" title="축소" aria-label="축소">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <span id="zoom-level" class="zoom-level">100%</span>
        <button id="zoom-in" class="icon-btn" title="확대" aria-label="확대">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </div>
      <div class="toolbar-sep" aria-hidden="true"></div>
      <button id="measure-btn" class="icon-btn" title="거리 측정 (두 점 클릭)" aria-label="거리 측정" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.3 8.7 15.3 2.7a1 1 0 0 0-1.4 0L2.7 13.9a1 1 0 0 0 0 1.4l6 6a1 1 0 0 0 1.4 0L21.3 10a1 1 0 0 0 0-1.4z"/><path d="m7.5 10.5 2 2"/><path d="m10.5 7.5 2 2"/><path d="m13.5 4.5 2 2"/></svg>
      </button>
      <button id="invert-btn" class="icon-btn" title="도면 모드 (어두운 배경 반전)" aria-label="도면 모드 전환" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="toolbar-sep" aria-hidden="true"></div>
      <button id="search-btn" class="icon-btn" title="문서 내 검색 (Ctrl+F)" aria-label="문서 내 검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <div class="toolbar-sep" aria-hidden="true"></div>
      <button id="markup-toggle-btn" class="icon-btn" title="마크업 보기/숨기기" aria-label="마크업 보기 전환" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>
      </button>
      <button id="markup-add-btn" class="icon-btn" title="마크업 추가 (영역을 드래그)" aria-label="마크업 추가" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 9v6"/><path d="M9 12h6"/></svg>
      </button>
      <button id="text-tool-btn" class="icon-btn" title="텍스트 추가 (빈 곳을 클릭)" aria-label="텍스트 추가" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14"/><path d="M12 6v14"/><path d="M9 20h6"/></svg>
      </button>
      <label id="markup-include-wrap" class="markup-include-toggle" hidden>
        <input type="checkbox" id="markup-include-checkbox" /> 마크업 포함
      </label>
      <div class="toolbar-sep" aria-hidden="true"></div>
      <div id="presence-list" class="presence-list" aria-label="현재 이 문서를 보고 있는 사람"></div>
      <button id="print-btn" class="btn-pill" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V4h12v5"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
        <span class="btn-label">출력</span>
      </button>
      <button id="download-btn" class="btn-pill btn-pill-primary" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        <span class="btn-label">저장</span>
      </button>
    </div>
  </header>

  <div id="measure-bar" class="measure-bar" hidden>
    <span id="measure-hint">두 점을 클릭해 거리를 측정하세요</span>
    <button id="measure-calibrate" class="btn-pill" title="알고 있는 실제 길이로 축척을 보정합니다">기준 보정</button>
    <button id="measure-clear" class="btn-pill">지우기</button>
    <button id="measure-close" class="icon-btn" title="측정 종료 (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <div id="search-bar" class="search-bar" hidden>
    <input id="search-input" type="text" placeholder="문서 내 검색…" autocomplete="off" />
    <span id="search-count" class="search-count"></span>
    <button id="search-prev" class="icon-btn" title="이전 결과" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <button id="search-next" class="icon-btn" title="다음 결과" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button id="search-close" class="icon-btn" title="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <main id="pages" class="pages-container"></main>

  <main id="grid" class="grid-container" hidden>
    <div id="grid-head" class="grid-head"></div>
    <div id="grid-scroll" class="grid-scroll">
      <div id="grid-inner" class="grid-inner">
        <table id="grid-table" class="grid-table"></table>
      </div>
    </div>
    <div id="sheet-tabs" class="sheet-tabs" role="tablist"></div>
  </main>

  <div id="error-screen" class="error-screen" hidden>
    <div class="error-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <p id="error-message"></p>
      <a href="/" class="btn-pill btn-pill-primary">문서 목록으로</a>
    </div>
  </div>

  <script src="/js/viewer.js"></script>
</body>
</html>

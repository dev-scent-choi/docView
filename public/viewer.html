<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocView — 뷰어</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='19' height='26' rx='3' fill='%231f4d47'/%3E%3Cpath d='M18 3v6a2 2 0 0 0 2 2h6z' fill='%234fd6c4'/%3E%3Crect x='9' y='16' width='11' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3Crect x='9' y='21' width='8' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="viewer-body">
  <header class="viewer-toolbar" id="toolbar">
    <div class="toolbar-row toolbar-row-title">
      <div class="toolbar-group toolbar-left">
        <a href="/" id="back-btn" class="icon-btn" title="문서 목록으로" aria-label="문서 목록으로 돌아가기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </a>
        <span id="doc-title" class="doc-title">문서 불러오는 중…</span>
      </div>
      <div id="presence-list" class="presence-list" aria-label="현재 이 문서를 보고 있는 사람"></div>
      <button id="search-btn" class="icon-btn" title="문서 내 검색 (Ctrl+F)" aria-label="문서 내 검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>

    <div class="toolbar-row toolbar-row-tools">
      <div id="toolbar-tools-left" class="toolbar-group toolbar-tools toolbar-tools-left">
        <button id="contents-btn" class="icon-btn" title="콘텐츠 (준비 중)" aria-label="콘텐츠" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
        <button id="undo-btn" class="icon-btn" title="실행 취소 (준비 중)" aria-label="실행 취소" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
        </button>
        <div class="toolbar-sep" aria-hidden="true"></div>
        <button id="markup-add-btn" class="icon-btn icon-btn-caret" title="강조 표시 (영역을 드래그)" aria-label="강조 표시" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5-10.5a2.12 2.12 0 0 0-3-3L5 17v3Z"/><path d="m13 6.5 4 4"/></svg>
          <svg class="icon-btn-caret-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button id="draw-btn" class="icon-btn icon-btn-caret" title="그리기 (준비 중)" aria-label="그리기" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          <svg class="icon-btn-caret-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button id="erase-btn" class="icon-btn" title="지우기 (준비 중)" aria-label="지우기" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-.94-.94-.94-2.46 0-3.4l9.6-9.6c.94-.94 2.46-.94 3.4 0l5.3 5.3c.94.94.94 2.46 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        </button>
        <div class="toolbar-sep" aria-hidden="true"></div>
        <button id="text-tool-btn" class="icon-btn" title="텍스트 추가 (빈 곳을 클릭)" aria-label="텍스트 추가" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14"/><path d="M12 6v14"/><path d="M9 20h6"/></svg>
        </button>
        <div class="toolbar-sep" aria-hidden="true"></div>
        <button id="translate-btn" class="icon-btn" title="번역 (준비 중)" aria-label="번역" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a15.3 15.3 0 0 1 4 9 15.3 15.3 0 0 1-4 9 15.3 15.3 0 0 1-4-9 15.3 15.3 0 0 1 4-9Z"/></svg>
        </button>
        <div class="toolbar-sep" aria-hidden="true"></div>
        <button id="measure-btn" class="icon-btn" title="거리 측정 (두 점 클릭)" aria-label="거리 측정" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.3 8.7 15.3 2.7a1 1 0 0 0-1.4 0L2.7 13.9a1 1 0 0 0 0 1.4l6 6a1 1 0 0 0 1.4 0L21.3 10a1 1 0 0 0 0-1.4z"/><path d="m7.5 10.5 2 2"/><path d="m10.5 7.5 2 2"/><path d="m13.5 4.5 2 2"/></svg>
        </button>
        <button id="invert-btn" class="icon-btn" title="도면 모드 (어두운 배경 반전)" aria-label="도면 모드 전환" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button id="markup-toggle-btn" class="icon-btn" title="마크업 보기/숨기기" aria-label="마크업 보기 전환" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>
        </button>
        <label id="markup-include-wrap" class="markup-include-toggle" hidden>
          <input type="checkbox" id="markup-include-checkbox" /> 마크업 포함
        </label>
        <div id="toolbar-more-wrap" class="toolbar-more-wrap">
          <button id="toolbar-more-btn" class="icon-btn" title="더보기" aria-label="더보기 도구" aria-haspopup="true" aria-expanded="false" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
          <div id="toolbar-more-menu" class="toolbar-more-menu" role="menu" hidden></div>
        </div>
      </div>

      <div class="toolbar-group toolbar-tools toolbar-tools-center">
        <button id="zoom-in" class="icon-btn" title="확대" aria-label="확대">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
        <button id="zoom-out" class="icon-btn" title="축소" aria-label="축소">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <button id="zoom-fit-btn" class="icon-btn" title="폭에 맞추기" aria-label="폭에 맞추기" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="m8 8-4 4 4 4"/><path d="m16 8 4 4-4 4"/></svg>
        </button>
        <span id="zoom-level" class="zoom-level">100%</span>
        <div class="page-jump-group" role="group" aria-label="페이지 정보">
          <input id="page-jump-input" class="page-jump-input" type="text" inputmode="numeric" aria-label="페이지 번호" value="1" />
          <span id="page-jump-total" class="page-jump-total">의 1</span>
        </div>
        <button id="rotate-btn" class="icon-btn" title="회전" aria-label="회전">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button id="page-view-btn" class="icon-btn" title="페이지 보기 (준비 중)" aria-label="페이지 보기" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        </button>
      </div>

      <div class="toolbar-group toolbar-tools toolbar-tools-right">
        <button id="print-btn" class="icon-btn" title="인쇄" aria-label="인쇄" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V4h12v5"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
        </button>
        <button id="download-btn" class="icon-btn" title="저장" aria-label="저장" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
        <button id="download-as-btn" class="icon-btn" title="다른 이름으로 저장" aria-label="다른 이름으로 저장" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <svg class="icon-btn-badge" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7" fill="var(--v-glass)" stroke="var(--v-glass-line)" stroke-width="1"/>
            <path d="M4.8 11.2 5.2 9l4.4-4.4 1.8 1.8L7 10.8l-2.2.4Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div id="measure-bar" class="measure-bar" hidden>
    <span id="measure-hint">두 점을 클릭해 거리를 측정하세요</span>
    <button id="measure-calibrate" class="btn-pill" title="알고 있는 실제 길이로 축척을 보정합니다">기준 보정</button>
    <button id="measure-clear" class="btn-pill">지우기</button>
    <button id="measure-close" class="icon-btn" title="측정 종료 (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <div id="search-bar" class="search-bar" hidden>
    <input id="search-input" type="text" placeholder="문서 내 검색…" autocomplete="off" />
    <span id="search-count" class="search-count"></span>
    <button id="search-prev" class="icon-btn" title="이전 결과" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <button id="search-next" class="icon-btn" title="다음 결과" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button id="search-close" class="icon-btn" title="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <main id="pages" class="pages-container"></main>

  <main id="grid" class="grid-container" hidden>
    <!-- 편집기(editor-grid.html)의 수식 입력줄(.formula-bar: 이름 상자 + fx + 셀 내용)과 같은 자리
         (툴바 바로 밑, 그리드 내용 바로 위)에 두는 읽기 전용 버전 — 선택한 칸의 실제 값을 폭 제한
         없이 전체 보여준다(하단 상태줄에는 더 이상 별도의 작은 참조 표시가 없다 — 예전에 있던
         #grid-cell-ref는 사용자 요청으로 제거했다). 뷰어는 고칠 수 없으므로 <input>이 아니라 표시
         전용 <div>를 쓴다(수정 기능은 전혀 없음). -->
    <div class="grid-formula-bar">
      <span id="grid-formula-ref" class="cell-ref-box"></span>
      <span class="fx-icon" aria-hidden="true">fx</span>
      <div id="grid-formula-value" class="formula-input formula-input-readonly" aria-live="polite" aria-label="선택한 셀 값"></div>
    </div>
    <div id="grid-zoom-host">
      <div id="grid-head" class="grid-head"></div>
      <div id="grid-scroll" class="grid-scroll" tabindex="0">
        <div id="grid-inner" class="grid-inner">
          <table id="grid-table" class="grid-table"></table>
        </div>
      </div>
    </div>
    <div class="grid-status-bar">
      <div class="grid-tabs-row">
        <div id="sheet-tabs" class="grid-sheet-tabs" role="tablist"></div>
      </div>
      <div class="grid-status-row">
        <span id="grid-status-text" class="grid-status-text">읽기 전용</span>
        <div class="zoom-group" role="group" aria-label="확대/축소">
          <button id="grid-zoom-out" type="button" class="zoom-btn" title="축소" aria-label="축소">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <div class="zoom-slider-track" id="grid-zoom-slider-track">
            <div class="zoom-slider-fill" id="grid-zoom-slider-fill"></div>
            <div class="zoom-slider-handle" id="grid-zoom-slider-handle"></div>
          </div>
          <button id="grid-zoom-in" type="button" class="zoom-btn" title="확대" aria-label="확대">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </button>
          <span class="zoom-sep"></span>
          <span id="grid-zoom-level" class="zoom-level">100%</span>
        </div>
      </div>
    </div>
    <div class="grid-watermark-overlay" aria-hidden="true"></div>
  </main>

  <div id="error-screen" class="error-screen" hidden>
    <div class="error-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <p id="error-message"></p>
      <a href="/" class="btn-pill btn-pill-primary">문서 목록으로</a>
    </div>
  </div>

  <script src="/js/viewer.js"></script>
</body>
</html>

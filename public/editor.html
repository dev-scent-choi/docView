<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocView — 동시편집</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='19' height='26' rx='3' fill='%231f4d47'/%3E%3Cpath d='M18 3v6a2 2 0 0 0 2 2h6z' fill='%234fd6c4'/%3E%3Crect x='9' y='16' width='11' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3Crect x='9' y='21' width='8' height='2' rx='1' fill='%23fff' fill-opacity='.9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="editor-body">
  <script>
    // 다른 화면에 iframe으로 임베드할 때 툴바 없이 콘텐츠만 보이게 하는 옵션 (editor-grid.html과 동일)
    if (new URLSearchParams(location.search).get('chrome') === 'hidden') {
      document.body.classList.add('chrome-hidden');
    }
  </script>
  <header class="editor-toolbar" id="toolbar">
    <div class="toolbar-top-row">
      <div class="toolbar-group toolbar-left">
        <a href="/" class="icon-btn" title="문서 목록으로" aria-label="문서 목록으로 돌아가기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </a>
        <span id="doc-title" class="doc-title">문서 불러오는 중…</span>
        <span id="conn-status" class="conn-status" data-status="connecting">연결 중…</span>
      </div>
      <div class="toolbar-group toolbar-right">
        <div class="zoom-group" role="group" aria-label="확대/축소">
          <button id="zoom-out" class="icon-btn" title="축소" aria-label="축소">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <span id="zoom-level" class="zoom-level">100%</span>
          <button id="zoom-in" class="icon-btn" title="확대" aria-label="확대">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </button>
        </div>
        <button id="search-btn" class="icon-btn" title="문서 내 검색 (Ctrl+F)" aria-label="문서 내 검색">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <div id="presence-list" class="presence-list" aria-label="현재 접속 중인 참여자"></div>
      </div>
    </div>
    <div class="toolbar-group toolbar-format">
      <div class="ribbon-group">
        <div class="ribbon-group-buttons">
          <button id="btn-undo" class="icon-btn" title="실행 취소 (Ctrl+Z)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.51 13a9 9 0 1 0 2.13-9.36L3 7"/></svg>
          </button>
          <button id="btn-redo" class="icon-btn" title="다시 실행 (Ctrl+Y)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M20.49 13a9 9 0 1 1-2.13-9.36L21 7"/></svg>
          </button>
        </div>
        <span class="ribbon-group-label">실행 취소</span>
      </div>

      <!-- 클립보드: 붙여넣기/잘라내기/복사/서식 복사 — 아직 별도 기능 없이 배치만 워드와 맞춘다
           (레이아웃 우선, 기능은 추후 작업). -->
      <div class="ribbon-group">
        <div class="ribbon-group-buttons">
          <span class="dropdown-btn">
            <button id="btn-paste" class="icon-btn icon-btn-big" title="붙여넣기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="10" height="4" rx="1"/><rect x="5" y="6" width="14" height="16" rx="1.5"/><path d="M9 12h6M9 16h6"/></svg>
              <span>붙여넣기</span>
            </button>
            <span class="dropdown-caret" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </span>
          <div class="ribbon-group-buttons-wrap">
            <div class="ribbon-row">
              <button id="btn-cut" class="icon-btn ribbon-btn-labeled" title="잘라내기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.5 8 20 20M8.5 16 20 4"/></svg>
                <span class="ribbon-btn-label">잘라내기</span>
              </button>
            </div>
            <div class="ribbon-row">
              <button id="btn-copy" class="icon-btn ribbon-btn-labeled" title="복사">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="1.3"/><path d="M15 8V5.5A1.5 1.5 0 0 0 13.5 4H5.5A1.5 1.5 0 0 0 4 5.5v11A1.5 1.5 0 0 0 5.5 18H8"/></svg>
                <span class="ribbon-btn-label">복사</span>
              </button>
            </div>
            <div class="ribbon-row">
              <button id="btn-format-painter" class="icon-btn ribbon-btn-labeled" title="서식 복사">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h9v5H9z"/><path d="M11 8v5H7a2 2 0 0 0-2 2v1"/><path d="m14 15 6 6"/><path d="M12.5 15.5a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L14 22l-4-4Z"/></svg>
                <span class="ribbon-btn-label">서식 복사</span>
              </button>
            </div>
          </div>
        </div>
        <span class="ribbon-group-label">클립보드</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons ribbon-group-buttons-wrap">
          <div class="ribbon-row">
            <select id="font-family" class="toolbar-select toolbar-select-full" title="글꼴(추후 적용 예정)" aria-label="글꼴">
              <option value="맑은 고딕">맑은 고딕</option>
              <option value="굴림">굴림</option>
              <option value="바탕">바탕</option>
              <option value="Arial">Arial</option>
              <option value="Calibri">Calibri</option>
            </select>
            <select id="font-size" class="toolbar-select" title="글자 크기" aria-label="글자 크기">
              <option value="">크기</option>
              <option value="10">10pt</option>
              <option value="11">11pt</option>
              <option value="12">12pt</option>
              <option value="14">14pt</option>
              <option value="16">16pt</option>
              <option value="18">18pt</option>
              <option value="24">24pt</option>
              <option value="32">32pt</option>
            </select>
            <button id="btn-font-grow" class="icon-btn icon-btn-fontsize" title="글자 크기 크게(추후 적용 예정)">
              <span class="fontsize-glyph">가</span><span class="fontsize-arrow">▲</span>
            </button>
            <button id="btn-font-shrink" class="icon-btn icon-btn-fontsize" title="글자 크기 작게(추후 적용 예정)">
              <span class="fontsize-glyph">가</span><span class="fontsize-arrow">▼</span>
            </button>
            <span class="dropdown-btn">
              <button id="btn-change-case" class="icon-btn" title="대/소문자 바꾸기(추후 적용 예정)">Aa</button>
              <span class="dropdown-caret" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </span>
            <button id="btn-clear-format" class="icon-btn" title="서식 지우기(추후 적용 예정)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-.94-.94-.94-2.46 0-3.4l9.6-9.6c.94-.94 2.46-.94 3.4 0l5.6 5.6c.94.94.94 2.46 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            </button>
          </div>
          <div class="ribbon-row">
            <button id="btn-bold" class="icon-btn icon-btn-glyph" title="굵게 (Ctrl+B)"><strong>가</strong></button>
            <button id="btn-italic" class="icon-btn icon-btn-glyph" title="기울임 (Ctrl+I)"><em>가</em></button>
            <span class="dropdown-btn">
              <button id="btn-underline" class="icon-btn icon-btn-glyph" title="밑줄 (Ctrl+U)"><u>가</u></button>
              <span class="dropdown-caret" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </span>
            <button id="btn-strike" class="icon-btn icon-btn-glyph" title="취소선"><s>가</s></button>
            <button id="btn-subscript" class="icon-btn" title="아래 첨자(추후 적용 예정)">x<sub>2</sub></button>
            <button id="btn-superscript" class="icon-btn" title="위 첨자(추후 적용 예정)">x<sup>2</sup></button>
            <span class="dropdown-btn color-dropdown-btn">
              <button id="btn-highlight-apply" class="icon-btn color-apply-btn" title="텍스트 강조색(추후 적용 예정)">
                <span class="color-btn-glyph">가</span>
                <span class="color-btn-bar" style="background: #ffe066;"></span>
              </button>
              <span class="dropdown-caret" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </span>
            <span class="color-btn" id="font-color-btn">
              <span class="color-btn-glyph">가</span>
              <span class="color-btn-bar"></span>
              <input id="font-color" class="color-btn-input" type="color" value="#1b1a17" title="글자 색" aria-label="글자 색" />
            </span>
            <button id="btn-clear-color" class="icon-btn" title="글자 색 지우기">가✕</button>
          </div>
        </div>
        <span class="ribbon-group-label">글꼴</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons ribbon-group-buttons-wrap">
          <div class="ribbon-row">
            <button id="btn-bullet-list" class="icon-btn" title="글머리 기호 목록">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1" fill="currentColor" stroke="none"/><path d="M9 6h11M9 12h11M9 18h11"/></svg>
            </button>
            <button id="btn-ordered-list" class="icon-btn" title="번호 매기기 목록">1.—</button>
            <button id="btn-multilevel-list" class="icon-btn" title="다단계 목록(추후 적용 예정)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M12 12h8M14 18h6"/><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="7.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="10.5" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
            </button>
            <button id="btn-outdent" class="icon-btn" title="내어쓰기(추후 적용 예정)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg>
            </button>
            <button id="btn-indent" class="icon-btn" title="들여쓰기(추후 적용 예정)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 4 4-4 4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg>
            </button>
          </div>
          <div class="ribbon-row">
            <button id="btn-align-left" class="icon-btn" title="왼쪽 정렬">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h14"/></svg>
            </button>
            <button id="btn-align-center" class="icon-btn" title="가운데 정렬">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M8 12h8M6 18h12"/></svg>
            </button>
            <button id="btn-align-right" class="icon-btn" title="오른쪽 정렬">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M10 12h10M6 18h14"/></svg>
            </button>
            <button id="btn-align-justify" class="icon-btn" title="양쪽 맞춤(추후 적용 예정)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <span class="dropdown-btn">
              <button id="btn-line-spacing" class="icon-btn" title="줄 간격(추후 적용 예정)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M4.5 6.5 7 4l2.5 2.5M4.5 17.5 7 20l2.5-2.5"/><path d="M13 6h7M13 12h7M13 18h7"/></svg>
              </button>
              <span class="dropdown-caret" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </span>
            <span class="dropdown-btn color-dropdown-btn">
              <button id="btn-shading-apply" class="icon-btn color-apply-btn" title="음영(추후 적용 예정)">
                <span class="color-btn-glyph">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.2"/></svg>
                </span>
                <span class="color-btn-bar" style="background: #d9d9d9;"></span>
              </button>
              <span class="dropdown-caret" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </span>
          </div>
        </div>
        <span class="ribbon-group-label">단락</span>
      </div>

      <!-- 스타일 갤러리 — 실제 워드처럼 미리보기 글자 + 이름을 나열한다. 표준/제목1/제목2만 지금
           있는 기능(btn-paragraph/btn-h1/btn-h2)에 연결돼 있고, 나머지는 배치만 맞춘 상태다. -->
      <div class="ribbon-group">
        <div class="style-gallery">
          <button id="btn-paragraph" class="style-gallery-item" data-preview="normal" title="표준">
            <span class="style-gallery-preview">가나다Aa</span>
            <span class="style-gallery-label">표준</span>
          </button>
          <button id="btn-style-nospacing" class="style-gallery-item" data-preview="spacingless" title="간격 없음(추후 적용 예정)">
            <span class="style-gallery-preview">가나다Aa</span>
            <span class="style-gallery-label">간격 없음</span>
          </button>
          <button id="btn-h1" class="style-gallery-item" data-preview="h1" title="제목 1">
            <span class="style-gallery-preview">가나다</span>
            <span class="style-gallery-label">제목 1</span>
          </button>
          <button id="btn-h2" class="style-gallery-item" data-preview="h2" title="제목 2">
            <span class="style-gallery-preview">가나다</span>
            <span class="style-gallery-label">제목 2</span>
          </button>
          <button id="btn-h3" class="style-gallery-item" data-preview="title" title="제목 3">
            <span class="style-gallery-preview">가나다</span>
            <span class="style-gallery-label">제목</span>
          </button>
          <button id="btn-style-subtitle" class="style-gallery-item" data-preview="subtitle" title="부제(추후 적용 예정)">
            <span class="style-gallery-preview">가나다</span>
            <span class="style-gallery-label">부제</span>
          </button>
          <button id="btn-style-subtle-emphasis" class="style-gallery-item" data-preview="emphasis" title="약한 강조(추후 적용 예정)">
            <span class="style-gallery-preview">가나다Aa</span>
            <span class="style-gallery-label">약한 강조</span>
          </button>
          <button id="btn-style-emphasis" class="style-gallery-item" data-preview="strong-emphasis" title="강조(추후 적용 예정)">
            <span class="style-gallery-preview">가나다Aa</span>
            <span class="style-gallery-label">강조</span>
          </button>
          <button id="btn-style-strong" class="style-gallery-item" data-preview="strong" title="굵은 텍스트(추후 적용 예정)">
            <span class="style-gallery-preview">가나다Aa</span>
            <span class="style-gallery-label">굵은 텍스트</span>
          </button>
          <button id="btn-style-quote" class="style-gallery-item" data-preview="quote" title="인용(추후 적용 예정)">
            <span class="style-gallery-preview">가나다Aa</span>
            <span class="style-gallery-label">인용</span>
          </button>
          <button id="btn-style-intense-quote" class="style-gallery-item" data-preview="intense-quote" title="강한 인용(추후 적용 예정)">
            <span class="style-gallery-preview">가나다Aa</span>
            <span class="style-gallery-label">강한 인용</span>
          </button>
        </div>
        <span class="ribbon-group-label">스타일</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons">
          <button id="btn-table" class="icon-btn" title="표 삽입 (2×2)">▦</button>
          <button id="btn-add-row" class="icon-btn" title="행 추가">+행</button>
          <button id="btn-add-col" class="icon-btn" title="열 추가">+열</button>
          <button id="btn-del-row" class="icon-btn" title="행 삭제">-행</button>
          <button id="btn-del-col" class="icon-btn" title="열 삭제">-열</button>
          <button id="btn-del-table" class="icon-btn" title="표 삭제">✕표</button>
        </div>
        <span class="ribbon-group-label">표</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons ribbon-group-buttons-wrap">
          <div class="ribbon-row">
            <button id="btn-ribbon-find" class="icon-btn ribbon-btn-labeled" title="찾기(추후 적용 예정 — 지금은 상단 검색 아이콘을 쓰세요)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <span class="ribbon-btn-label">찾기</span>
            </button>
          </div>
          <div class="ribbon-row">
            <button id="btn-ribbon-replace" class="icon-btn ribbon-btn-labeled" title="바꾸기(추후 적용 예정)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
              <span class="ribbon-btn-label">바꾸기</span>
            </button>
          </div>
          <div class="ribbon-row">
            <button id="btn-ribbon-select" class="icon-btn ribbon-btn-labeled" title="선택(추후 적용 예정)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v17l4.5-4.5L12 20l2-1-2.5-4.5L17 14z"/></svg>
              <span class="ribbon-btn-label">선택</span>
            </button>
          </div>
        </div>
        <span class="ribbon-group-label">편집</span>
      </div>

      <div class="ribbon-group">
        <div class="ribbon-group-buttons">
          <button id="btn-addins" class="icon-btn icon-btn-big" title="추가 기능(추후 적용 예정)">
            <span class="addin-dot"></span>
            <span>추가 기능</span>
          </button>
        </div>
        <span class="ribbon-group-label">추가 기능</span>
      </div>
    </div>
  </header>

  <div id="search-bar" class="search-bar" hidden>
    <input id="search-input" type="text" placeholder="문서 내 검색…" autocomplete="off" />
    <span id="search-count" class="search-count"></span>
    <button id="search-prev" class="icon-btn" title="이전 결과" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <button id="search-next" class="icon-btn" title="다음 결과" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button id="search-close" class="icon-btn" title="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <div id="unsupported-warning" class="unsupported-warning" hidden>
    이 문서에는 이미지 등 편집기가 지원하지 않는 요소가 포함되어 있습니다 — 이 화면에서 저장하면
    해당 요소는 사라집니다. 원본을 보존하려면 편집 대신 뷰어에서 다운로드하세요.
  </div>

  <div id="editor-zoom-host">
    <main id="editor" class="editor-surface"></main>
  </div>

  <div id="error-screen" class="error-screen" hidden>
    <div class="error-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <p id="error-message"></p>
      <a href="/" class="btn-pill btn-pill-primary">문서 목록으로</a>
    </div>
  </div>

  <script type="module" src="/js/editor.bundle.js"></script>
</body>
</html>
